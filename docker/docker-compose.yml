# ReelForge on one machine.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Optional extras, off unless asked for:
#   --profile local-llm   an Ollama container for fully local generation
#   --profile local-tts   a Kokoro container for fully local narration
#
# Everything a job produces lands in ./data/jobs/<id>/, which is a plain
# directory you can open, back up, or delete.

name: reelforge

x-common: &common
  # Plain form on purpose: the `path:`/`required:` long syntax needs Compose
  # v2.24+, and Docker 24 ships an older one. So `.env` must exist -- run
  # `cp .env.example .env` first, as the README says. It may be left empty.
  env_file: [../.env]
  # No `user:` here on purpose. The images' entrypoint starts as root, makes
  # the bind-mounted /app/data writable -- adopting the host directory's own
  # owner, so reels come out belonging to you -- and drops privileges before
  # exec'ing the app. Setting `user:` would start the container unprivileged
  # and take that ability away. Override with REELFORGE_UID / REELFORGE_GID in
  # ../.env if you need a specific one.
  environment:
    REELFORGE_EXECUTOR: celery
    REELFORGE_QUEUE__BROKER_URL: redis://redis:6379/0
    REELFORGE_QUEUE__RESULT_BACKEND: redis://redis:6379/1
  volumes:
    # the original pipeline, never written to
    - ../video:/app/video:ro
    - ../data:/app/data
    - ../config.yaml:/app/config.yaml:ro
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    # Loopback by default, because only /api/settings is guarded: publishing
    # this port also exposes jobs, the queue, artifact download and the
    # provider key balances to anything that can route to the box. Set
    # REELFORGE_BIND in docker/.env to widen it -- 0.0.0.0 for every
    # interface, or a single address (a Tailscale 100.x, say) to reach it
    # from one network and no other. Set REELFORGE_ADMIN_TOKEN in ../.env at
    # the same time; see docs/SETUP.md.
    ports: ["${REELFORGE_BIND:-127.0.0.1}:8020:8020"]

  # Short stages: ingest, content, audio, align, package. Kept off the render
  # queue so an eight-minute encode never blocks a thirty-second LLM call.
  worker:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    command: ["celery", "-A", "app.tasks", "worker", "--queues=celery",
              "--concurrency=4", "--loglevel=info"]

  # Rendering, cover art and storyboard smoke tests. CPU-bound for minutes at a
  # time, and the only place generated code runs.
  renderer:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.renderer
    environment:
      REELFORGE_EXECUTOR: celery
      REELFORGE_QUEUE__BROKER_URL: redis://redis:6379/0
      REELFORGE_QUEUE__RESULT_BACKEND: redis://redis:6379/1
      # 0 lets the renderer size itself from the container's CPU allocation.
      # Chunks already render in parallel inside one job, so celery concurrency
      # here is 2, not 8 -- otherwise the two levels of parallelism multiply.
      REELFORGE_RENDER__WORKERS: "0"
    # No cpu limit here on purpose. A hardcoded `limits: {cpus: "8"}` is not a
    # cap on a machine that has fewer than eight -- the daemon refuses the
    # service outright ("range of CPUs is from 0.01 to 1.00"), so the stack
    # would not start at all on a laptop, which is most of them. What the
    # renderer gets is whatever Docker was given, and WORKERS: 0 sizes itself
    # to that. To cap it deliberately on a big shared box, add a
    # docker-compose.override.yml:
    #
    #   services:
    #     renderer:
    #       deploy:
    #         resources:
    #           limits: {cpus: "8"}

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama-models:/root/.ollama]
    restart: unless-stopped

  tts:
    profiles: ["local-tts"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    # Published on its own port rather than 8080, which is a busy one on a
    # development machine and collided in practice. Inside the network the
    # app reaches it at http://tts:8880.
    ports: ["8880:8880"]
    restart: unless-stopped

volumes:
  redis-data:
  ollama-models:
