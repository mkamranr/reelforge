# ---------------------------------------------------------------------------
# ReelForge configuration.  This is the whole provider-switching surface:
# change `provider:` and the pipeline uses a different backend, no code edits.
# Secrets never live here -- they come from the environment (see .env.example).
# Any value can be overridden by an env var: REELFORGE_LLM__PROVIDER=ollama
# ---------------------------------------------------------------------------

llm:
  provider: ollama               # anthropic | openai | ollama | fake

  anthropic:
    model: claude-opus-5
    max_tokens: 16384
    temperature: 0.7
    api_key_env: ANTHROPIC_API_KEY

  # One adapter serves every OpenAI-compatible server. Point base_url at
  # OpenAI, vLLM, LM Studio, Together, Groq, OpenRouter or Azure.
  #   OpenAI proper : base_url https://api.openai.com/v1, model gpt-4o
  #   LM Studio     : base_url http://host.docker.internal:1234/v1
  # Defaults below point at a vLLM server on this machine, which needs no API key.
  openai:
    base_url: http://localhost:8000/v1
    model: qwen
    # vLLM here reports max_model_len 16384, and that ceiling covers prompt
    # *and* completion -- so this stays well under it. Raise for a hosted model.
    max_tokens: 6000
    temperature: 0.7
    api_key_env: OPENAI_API_KEY

    # How structured output is requested. The adapter falls through this list
    # in order, so a server that rejects one mode still works.
    #   json_schema  grammar-constrained decoding. Exact, and the right choice
    #                for a non-reasoning instruct model.
    #   json_object  valid JSON, shape unenforced.
    #   text         schema in the prompt; JSON recovered from the reply.
    #
    # Reasoning models (Qwen3, DeepSeek-R1 and similar) must NOT use
    # json_schema: the grammar forces JSON from the first token, leaving the
    # model no room to think, and it stalls. Measured against the local vLLM
    # box: over 5 minutes with no result under json_schema, 40 seconds in text
    # mode. Use text for a reasoning model; use json_schema for an instruct model.
    json_mode: text

  # Ollama's native API, used instead of its /v1 shim because `keep_alive`
  # decides whether the next stage pays the model-load cost again, and a cold
  # reload between stages is minutes of wall clock.
  ollama:
    base_url: http://localhost:11434   # http://ollama:11434 inside compose
    # A non-reasoning instruct model. It can use grammar-constrained decoding,
    # which a reasoning model cannot -- see the json_mode note above.
    model: qwen2.5:7b-instruct-q4_K_M
    max_tokens: 8000
    temperature: 0.7
    keep_alive: 30m

  # Per-stage overrides. Storyboard codegen benefits most from a strong model;
  # anything omitted inherits the top-level provider block.
  roles:
    content: {}
    storyboard: {}
    review: {}

content:
  # How the script gets written.
  #   whole      one call for the whole script -- best flow, use with a
  #              frontier model
  #   per_scene  an outline call then one call per scene -- a small local model
  #              returns 25 words when asked for 25, but 40 when asked for 95
  #   auto       try whole once, fall back to per_scene if it comes back wrong
  script_mode: auto
  target_seconds_min: 36.0
  target_seconds_max: 44.0
  max_attempts: 3

tts:
  # upload     -- you supply the narration file
  # elevenlabs -- hosted, highest quality, metered per character
  # openai     -- hosted
  # kokoro     -- self-hosted Kokoro-FastAPI, free, no key (profile local-tts)
  # local      -- any other self-hosted engine over HTTP (Piper, ...)
  # say        -- macOS `say`, development only, free and offline
  provider: upload

  elevenlabs:
    voice_id: JBFqnCBsd6RMkjVDRZzb     # GET /api/config/providers lists your voices
    model: eleven_multilingual_v2      # eleven_multilingual_v2 | eleven_turbo_v2_5 | eleven_v3
    output_format: mp3_44100_128
    stability: 0.5
    similarity_boost: 0.75
    style: 0.0
    use_speaker_boost: true
    # Credits are metered per character. A 40 s reel is roughly 550-700
    # characters, so this ceiling is about six reels' worth per job and exists
    # to make an accidental long job fail before it spends anything.
    max_characters_per_job: 4000

    # Keys. Read from .env, never stored in this file.
    # One variable, which may itself hold several comma-separated keys:
    api_key_env: ELEVENLABS_API_KEY
    # ...or name several. They are used in order, and when one runs out of
    # credit mid-narration the next takes over automatically.
    api_key_envs: [ELEVENLABS_API_KEY, ELEVENLABS_API_KEY_2, ELEVENLABS_API_KEY_3]
    # Pin one key by label ("ELEVENLABS_API_KEY_2") or 0-based position.
    # null rotates automatically. Pinning disables rotation deliberately.
    active_key: null

  openai:
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini-tts
    voice: onyx                        # alloy|echo|fable|onyx|nova|shimmer|...
    api_key_env: OPENAI_API_KEY

  # Kokoro: self-hosted, free, no key, runs on CPU. Either server works --
  # Kokoro-TTS-OpenAPI (python -m app, port 8080) or the Kokoro-FastAPI
  # container the local-tts compose profile starts (port 8880); the adapter
  # finds whichever voice endpoint is there. Voices are <language><gender>_<name> --
  # af_heart is American female, bm_george British male -- and the Settings
  # page lists what the server actually has rather than making you recall
  # them. A weighted blend works too: af_bella(2)+af_heart(1).
  kokoro:
    base_url: http://localhost:8080   # Kokoro-TTS-OpenAPI; the container is :8880
    voice: af_heart
    model: kokoro
    response_format: wav
    speed: 1.0
    language: ""                      # empty = the voice decides
    request_timeout: 300              # CPU inference is roughly real time

  # The generic self-hosted adapter: anything that takes {text, voice} over
  # HTTP. Kokoro has its own profile above; this is for Piper and the rest.
  local:
    base_url: http://tts:8080
    voice: af_heart
    engine: kokoro

  say:
    voice: Daniel
    rate: 165

  # Fish-Speech / OpenAudio behind its Gradio app: self-hosted, free, clones a
  # voice from a short recording. With no reference configured the adapter
  # fixes a voice itself from one seeded calibration line and reuses it.
  fish:
    base_url: http://localhost:7860
    api_name: /partial
    reference_audio: ""            # a 10-30 s wav of the voice to clone
    reference_text: ""             # its transcript
    reference_id: ""               # or a voice the server holds under references/<id>
    seed: 1
    temperature: 0.8
    top_p: 0.8
    repetition_penalty: 1.1
    chunk_length: 300

# Generated imagery: stills for the scenes, a short clip, a backdrop under the
# cover's typography. Off until a profile other than `none` is active -- then
# the `visuals` stage runs after `cover`, and every reel gets pictures drawn by
# the image model rather than only by the renderer.
#
# The backend is a ComfyUI server. Two API-format workflows ship in
# app/workflows/ (Qwen-Image 2512 for stills, LTX 2.5 text-to-video for clips);
# the adapter rewrites their prompt, size, seed and duration nodes and submits
# them as they are. Export your own with Workflow > Export (API) and point a
# profile at the file.
visuals:
  active: none
  profiles:
    none:
      adapter: none
    comfyui:
      adapter: comfyui
      base_url: http://localhost:8188       # http://comfyui:8188 inside compose
      image_workflow: app/workflows/image_qwen_image_2512.json
      video_workflow: app/workflows/video_ltx2_5_t2v.json   # empty = stills only
      # Which node carries what, by id in the shipped workflows. Leave the map
      # out for a workflow of your own and the adapter finds them by walking
      # the graph; name them only when it guesses wrong.
      image_nodes: {prompt: "238:227", negative: "238:228", size: "238:232",
                    seed: "238:230", lightning: "238:229", save: "60"}
      video_nodes: {prompt: "405:376", negative: "405:373", seconds: "405:362",
                    fps: "405:361", enhancer: "405:383", resolution: "409", save: "75"}
      # Text-to-audio (Stable Audio 3) for the music bed and the cut sounds.
      # Not speech -- narration stays with the voice profiles. Empty = none.
      audio_workflow: app/workflows/audio_stable_audio_3_medium_base.json
      audio_nodes: {prompt: "52:31", negative: "52:7", seconds: "52:36", seed: "52:3",
                    category: "52:43", enhancer: "52:35", save: "19"}
      audio_enhancer: true       # let the workflow's LLM node expand the music prompt
      lightning: true            # Qwen's 4-step LoRA: seconds per still instead of a minute
      prompt_enhancer: true      # let the LTX workflow's Gemma node expand the shot
      image_width: 1152          # 3:4 -- fills the panel band, crops cleanly to full frame
      image_height: 1536
      request_timeout: 1800      # a 5 s LTX clip is minutes on a single GPU
      api_key_env: ""            # only for a server behind an auth proxy
    # Stock photography and footage instead of a generator: no GPU, no
    # workflows, a free key from https://www.pexels.com/api/. The pictures are
    # searched, so the art director's two-word `query` per scene is what does
    # the work, and the scene's seed picks among the results. No audio: Pexels
    # has no sound library, so a music bed still needs a ComfyUI profile.
    pexels:
      adapter: pexels
      api_key_env: PEXELS_API_KEY
      orientation: portrait        # the reel is 1080x1920; anything else is cropped hard
      photo_size: large
      video_quality: hd            # the smallest file at least 1080 wide wins either way
      pool: 15                     # results per search to choose among; max 80
      clip_start: 0.5              # skip a fade-in, when the shot is long enough to spare it
      image_width: 1152            # what the still is prepared to, as with ComfyUI
      image_height: 1536
      request_timeout: 60
  # How much a reel gets. Ceilings: a three-scene script has one body scene.
  # Clips are the point -- moving pictures carry a reel -- and are assigned to
  # the body scenes first; stills only take scenes left over.
  stills: 1
  clips: 3
  clip_seconds: 5.0
  cover: true                  # paint the cover over a generated backdrop
  still_fit: full              # full = bleeds under a scrim; panel = in a card
  # Appended to every prompt so a reel's assets share one look. The template's
  # palette words are added at generation time.
  style: "cinematic, photoreal, shallow depth of field, soft volumetric light, a bright well-lit subject on a dark background, no text, no letters, no logos, no watermark"
  negative: ""                 # empty keeps each workflow's own negative prompt
  # A generated instrumental bed under the narration, from the template's
  # music hint. Off by default -- DEVELOPMENT.md's rule is voice only, and a
  # bed anyone notices is too loud. Ducked under the voice by an envelope
  # follower; gain is relative to full scale, duck is how far it drops while
  # the narrator speaks.
  music: false
  music_gain_db: -22.0
  music_duck_db: -9.0
  # Generated one-shots for the storyboards' cut sounds (thump, swish, tick,
  # ... twelve kinds across the three families) in place of the synthesized
  # set. Made once into data/sfx/<profile>/ and reused by every reel.
  sfx_samples: false

ingest:
  github_token_env: GITHUB_TOKEN
  hf_token_env: HUGGINGFACE_TOKEN
  timeout_seconds: 30
  readme_max_chars: 60000

render:
  chunk_seconds: 4.0             # must be a whole number of 2 s GOPs
  # 0 = decide from the machine (cores - 1, capped at 8). Each worker runs a
  # renderer and an encoder, so setting this to twice the core count does not
  # go faster -- it thrashes.
  workers: 0
  safe_encode: false             # true = single-process pipe, exactly like make.sh
  fps: 30
  width: 1080
  height: 1920

fonts:
  # Bundled OSS faces. Helvetica Neue and Menlo are macOS-only and not
  # redistributable, so kit.f / kit.m are patched at render time.
  display_dir: docker/fonts
  display_family: Inter
  mono_family: DejaVuSansMono   # JetBrainsMono is available but lacks the rotate/star glyphs

storyboard:
  max_repair_attempts: 3
  vision_review: false           # needs a multimodal provider
  fallback_to_template: true
  smoke_frames: 16
  smoke_timeout_seconds: 90
  memory_limit_mb: 3072

paths:
  video_dir: video               # the untouched existing pipeline
  data_dir: data
  out_dir: out

queue:
  broker_url: redis://redis:6379/0
  result_backend: redis://redis:6379/1
  progress_channel_prefix: reelforge:progress
